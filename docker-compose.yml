name: campusconnect

services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: campus-postgres-auth
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-campus_auth}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-auth_password_dev}
    ports:
      - "127.0.0.1:${POSTGRES_AUTH_PORT:-5433}:5432"
    volumes:
      - campus-postgres-auth-data:/var/lib/postgresql/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER:-campus_auth} -d ${POSTGRES_AUTH_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-student:
    image: postgres:16-alpine
    container_name: campus-postgres-student
    environment:
      POSTGRES_DB: ${POSTGRES_STUDENT_DB:-student_db}
      POSTGRES_USER: ${POSTGRES_STUDENT_USER:-campus_student}
      POSTGRES_PASSWORD: ${POSTGRES_STUDENT_PASSWORD:-student_password_dev}
    ports:
      - "127.0.0.1:${POSTGRES_STUDENT_PORT:-5434}:5432"
    volumes:
      - campus-postgres-student-data:/var/lib/postgresql/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_STUDENT_USER:-campus_student} -d ${POSTGRES_STUDENT_DB:-student_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: campus-kafka
    ports:
      - "${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:${KAFKA_PORT:-9092},CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - campus-kafka-data:/var/lib/kafka/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5

  eureka-server:
    build:
      context: ./eureka-server
    container_name: campus-eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health > /dev/null 2>&1 || curl -sf http://localhost:8761/actuator/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  config-server:
    build:
      context: ./config-server
    container_name: campus-config-server
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    ports:
      - "127.0.0.1:${CONFIG_SERVER_PORT:-8888}:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health > /dev/null 2>&1 || curl -sf http://localhost:8888/actuator/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  campus-postgres-auth-data:
  campus-postgres-student-data:
  campus-kafka-data:

networks:
  campus-net:
    name: campus-net
    driver: bridge